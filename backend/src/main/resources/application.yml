server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: arc-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/arc}
    username: ${DATABASE_USERNAME:arc}
    password: ${DATABASE_PASSWORD:arc_local_password}
  sql:
    init:
      mode: always
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

arc:
  jira:
    base-url: ${JIRA_BASE_URL:https://tasks.belesai.kz}
    username: ${JIRA_USERNAME:}
    api-token: ${JIRA_API_TOKEN:}
    cache-seconds: ${JIRA_CACHE_SECONDS:180}

logging:
  level:
    root: INFO
    org.springframework.web.client: WARN
